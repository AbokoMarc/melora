<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Melora</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0d0d0f">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Melora">
<script>
  // Applique le thème AVANT le premier rendu, pour éviter le flash blanc/sombre au chargement.
  (function () {
    var t = localStorage.getItem('melora_theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<script src="/config.js"></script>
<script src="/assets/js/idb-lite.js"></script>
<script src="/assets/js/install-prompt.js" defer></script>
<style>
  :root, :root[data-theme="dark"] {
    --bg:#0d0d0f; --panel:#17171b; --panel2:#1e1e23; --border:#2a2a30;
    --text:#e8e6e1; --muted:#8b8a92; --accent:#d9822b; --accent-text:#111;
    --bubble-me:#3a2a17; --bubble-them:#1e1e23;
    --green:#3ecf6a; --amber:#e0a94a; --red:#e05a4a; --blue-tick:#5bb8ff;
  }
  :root[data-theme="light"] {
    --bg:#faf8f4; --panel:#ffffff; --panel2:#eef2f8; --border:#dde2ea;
    --text:#1c1c1e; --muted:#6b6f76; --accent:#c9711f; --accent-text:#fff;
    --bubble-me:#dbe9fb; --bubble-them:#f0f3f8;
    --green:#2a9d55; --amber:#b97a1c; --red:#c0392b; --blue-tick:#2b7fd9;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  input, textarea, button { font-family:inherit; }
  #app { display:flex; height:100dvh; overflow:hidden; }

  /* --- Rail (nav desktop) --- */
  #rail { width:64px; background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; align-items:center; padding:14px 0; flex-shrink:0; }
  #rail .brand-badge { width:34px; height:34px; border-radius:9px; background:var(--accent); color:var(--accent-text); display:flex; align-items:center; justify-content:center; font-family:Georgia,serif; font-weight:700; margin-bottom:18px; }
  .rail-btn { width:44px; height:44px; border-radius:10px; background:none; border:none; color:var(--muted); font-size:1.25rem; cursor:pointer; margin-bottom:6px; }
  .rail-btn.active { background:var(--panel2); color:var(--text); }
  .rail-btn svg, #bottomNav button svg { display:block; margin:0 auto; }
  #rail .rail-spacer { flex:1; }

  /* --- Liste (conversations / statuts / appels / paramètres) --- */
  #listPane { width:340px; background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; overflow:hidden; }
  .pane-header { font-family:Georgia,serif; font-size:1.15rem; padding:16px 16px 8px; }
  #search { margin:0 16px 8px; padding:9px 12px; background:var(--panel2); border:1px solid var(--border); border-radius:8px; color:var(--text); }
  .filter-chips { display:flex; gap:8px; padding:0 16px 10px; }
  .chip { background:var(--panel2); border:1px solid var(--border); color:var(--muted); border-radius:999px; padding:6px 14px; font-size:.8rem; cursor:pointer; }
  .chip.active { background:var(--accent); color:var(--accent-text); border-color:var(--accent); font-weight:600; }
  .scroll-list { flex:1; overflow-y:auto; }

  .conv-item { display:flex; gap:10px; padding:10px 16px; cursor:pointer; align-items:center; }
  .conv-item:hover, .conv-item.active { background:var(--panel2); }
  .avatar { width:42px; height:42px; border-radius:50%; background:var(--accent); color:var(--accent-text); display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0; }
  .conv-meta { flex:1; min-width:0; }
  .conv-name { display:flex; justify-content:space-between; font-weight:600; font-size:.92rem; }
  .conv-name span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .unread { background:var(--accent); color:var(--accent-text); font-size:.7rem; font-weight:700; border-radius:999px; padding:1px 7px; }
  .conv-preview { color:var(--muted); font-size:.82rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .empty-hint { color:var(--muted); font-size:.85rem; padding:24px 16px; text-align:center; }

  #topbar { border-top:1px solid var(--border); padding:10px 16px; display:flex; justify-content:space-between; align-items:center; }

  /* --- Statuts --- */
  .status-add-row { display:flex; gap:10px; align-items:center; padding:8px 16px 14px; cursor:pointer; }
  .status-add-row .avatar { position:relative; }
  .status-add-row .plus { position:absolute; bottom:-2px; right:-2px; width:16px; height:16px; border-radius:50%; background:var(--accent); color:var(--accent-text); font-size:.7rem; display:flex; align-items:center; justify-content:center; }
  .status-item { display:flex; gap:10px; padding:9px 16px; cursor:pointer; align-items:center; }
  .status-item:hover { background:var(--panel2); }
  .status-ring { width:44px; height:44px; border-radius:50%; padding:2px; border:2px solid var(--accent); flex-shrink:0; }
  .status-ring.seen { border-color:var(--border); }
  .status-ring .avatar { width:100%; height:100%; }
  .status-time { color:var(--muted); font-size:.78rem; }
  #statusOverlay { position:fixed; inset:0; background:#000; z-index:95; display:none; flex-direction:column; }
  #statusOverlay .status-header { display:flex; align-items:center; gap:10px; padding:16px; color:#fff; flex-shrink:0; }
  #statusOverlay .status-header-info { flex:1; min-width:0; }
  #statusOverlay .status-header-info strong { display:block; font-size:.95rem; }
  #statusOverlay .status-header-info span { font-size:.72rem; color:#ccc; }
  #statusOverlay .status-header button { background:rgba(255,255,255,.12); border:none; color:#fff; width:36px; height:36px; border-radius:50%; font-size:1.1rem; cursor:pointer; flex-shrink:0; }
  #statusOverlay .status-body { flex:1; position:relative; display:flex; align-items:center; justify-content:center; padding:20px; overflow:hidden; }
  #statusOverlay .status-card { width:min(92vw,420px); height:100%; max-height:min(65vh,560px); border-radius:14px; display:flex; align-items:center; justify-content:center; padding:30px; text-align:center; font-size:1.4rem; font-family:Georgia,serif; color:#fff; word-wrap:break-word; }
  #statusOverlay .status-zone { position:absolute; top:0; bottom:0; width:32%; cursor:pointer; }
  #statusOverlay .status-zone.prev { left:0; }
  #statusOverlay .status-zone.next { right:0; }
  #statusComposer { position:fixed; inset:0; background:var(--bg); z-index:95; display:none; flex-direction:column; padding:20px; }
  #statusComposer textarea { flex:1; background:none; border:none; color:#fff; font-size:1.6rem; font-family:Georgia,serif; text-align:center; resize:none; outline:none; }
  #statusComposer .swatches { display:flex; gap:10px; justify-content:center; padding:14px 0; }
  #statusComposer .swatch { width:28px; height:28px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
  #statusComposer .swatch.active { border-color:#fff; }

  /* --- Appels --- */
  .call-item { display:flex; gap:10px; padding:10px 16px; align-items:center; cursor:default; }
  .call-item:hover { background:var(--panel2); }
  .call-line { display:flex; align-items:center; gap:6px; font-size:.82rem; }
  .call-dir { font-size:.9rem; }
  .call-dir.missed { color:var(--red); }
  .call-dir.in { color:var(--green); }
  .call-quickbtn { margin-left:auto; background:none; border:none; color:var(--accent); font-size:1.1rem; cursor:pointer; }

  /* --- Paramètres --- */
  #paneSettings { padding:16px; overflow-y:auto; }
  .settings-avatar { width:72px; height:72px; border-radius:50%; background:var(--accent); color:var(--accent-text); display:flex; align-items:center; justify-content:center; font-size:1.6rem; font-weight:700; margin:0 auto 14px; }
  .settings-field { margin-bottom:14px; }
  .settings-field label { display:block; font-size:.78rem; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.02em; }
  .settings-field input, .settings-field textarea { width:100%; padding:9px 12px; background:var(--panel2); border:1px solid var(--border); border-radius:8px; color:var(--text); }
  .settings-row { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-top:1px solid var(--border); }
  .theme-switch { display:flex; background:var(--panel2); border-radius:999px; padding:3px; gap:2px; }
  .theme-switch button { border:none; background:none; color:var(--muted); padding:6px 12px; border-radius:999px; font-size:.82rem; cursor:pointer; }
  .theme-switch button.active { background:var(--accent); color:var(--accent-text); }
  .btn { background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:9px 14px; cursor:pointer; font-size:.85rem; }
  .btn.primary { background:var(--accent); color:var(--accent-text); border-color:var(--accent); font-weight:600; }
  .btn.danger { color:var(--red); }
  .btn.block { width:100%; margin-top:8px; }

  /* --- Zone de discussion --- */
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #chatHeader { display:none; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--border); }
  #backBtn { display:none; background:none; border:none; color:var(--text); font-size:1.3rem; cursor:pointer; padding:0 4px; }
  #chatPlaceholder { flex:1; display:flex; align-items:center; justify-content:center; color:var(--muted); text-align:center; padding:20px; }
  #messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:70%; padding:9px 12px; border-radius:12px; font-size:.92rem; word-wrap:break-word; }
  .msg.me { align-self:flex-end; background:var(--bubble-me); border-bottom-right-radius:3px; }
  .msg.them { align-self:flex-start; background:var(--bubble-them); border-bottom-left-radius:3px; }
  .msg .meta { font-size:.7rem; color:var(--muted); margin-top:3px; text-align:right; }
  #typingIndicator { padding:0 16px 6px; color:var(--muted); font-size:.8rem; font-style:italic; min-height:1.1em; }
  #composer { display:none; padding:12px 16px; gap:10px; border-top:1px solid var(--border); align-items:center; }
  #composer input { flex:1; padding:10px 14px; background:var(--panel2); border:1px solid var(--border); border-radius:20px; color:var(--text); }
  #composer button { background:var(--accent); color:var(--accent-text); border:none; width:38px; height:38px; border-radius:50%; cursor:pointer; font-size:1rem; flex-shrink:0; }
  #micBtn { background:var(--panel2) !important; color:var(--text) !important; }
  #composer > button[onclick*="fileInput"] { background:var(--panel2) !important; color:var(--text) !important; }
  #viewOnceBtn { background:var(--panel2) !important; color:var(--text) !important; }
  #viewOnceBtn.active { background:var(--accent) !important; color:var(--accent-text) !important; }

  .close-x { float:right; cursor:pointer; color:var(--muted); }
  .call-btn { background:var(--panel2); border:1px solid var(--border); color:var(--text); width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:.95rem; }
  #incomingCall { position:fixed; top:16px; right:16px; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; z-index:80; display:none; box-shadow:0 8px 24px rgba(0,0,0,.4); max-width:calc(100vw - 32px); }
  #incomingCall .who { font-weight:600; margin-bottom:2px; }
  #incomingCall .sub { color:var(--muted); font-size:.82rem; margin-bottom:12px; }
  #incomingCall .actions { display:flex; gap:10px; }
  #incomingCall button { flex:1; border:none; border-radius:8px; padding:9px; cursor:pointer; font-weight:600; }
  #incomingCall .accept { background:var(--green); color:#111; }
  #incomingCall .decline { background:var(--red); color:#fff; }
  #callOverlay { position:fixed; inset:0; background:#0a0a0c; z-index:90; display:none; flex-direction:column; align-items:center; justify-content:center; color:#fff; }
  #callOverlay video#remoteVideo { max-width:100%; max-height:70vh; border-radius:12px; background:#000; }
  #callOverlay video#localVideo { position:absolute; bottom:110px; right:24px; width:120px; border-radius:10px; border:2px solid var(--border); background:#000; }
  #callOverlay .call-status { font-size:1.1rem; margin:16px 0 6px; }
  #callOverlay .call-name { font-size:1.4rem; font-family:Georgia,serif; }
  #callOverlay .call-controls { position:absolute; bottom:30px; display:flex; gap:16px; }
  #callOverlay .call-controls button { width:54px; height:54px; border-radius:50%; border:none; cursor:pointer; font-size:1.2rem; }
  #callOverlay .end-btn { background:var(--red); color:#fff; }
  #callOverlay .toggle-btn { background:var(--panel2); color:var(--text); }
  #callOverlay .toggle-btn.off { background:var(--accent); color:var(--accent-text); }

  #adminModal { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:85; display:none; align-items:center; justify-content:center; padding:20px; }
  #adminModal .box { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:20px; width:min(680px,100%); max-height:85vh; overflow-y:auto; }
  .admin-tabs { display:flex; gap:8px; margin:12px 0; }
  .admin-tabs button { background:var(--panel2); border:1px solid var(--border); color:var(--text); padding:6px 12px; border-radius:8px; cursor:pointer; font-size:.82rem; }
  .admin-tabs button.active { background:var(--accent); color:var(--accent-text); }
  .admin-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); font-size:.85rem; gap:8px; }
  .admin-row .actions { display:flex; gap:6px; flex-wrap:wrap; }
  .admin-row button { font-size:.75rem; padding:4px 8px; }
  table { width:100%; border-collapse:collapse; font-size:.82rem; }
  th, td { padding:8px; text-align:left; border-bottom:1px solid var(--border); }
  .pill { padding:2px 8px; border-radius:10px; font-size:.72rem; }
  .pill.active { background:#183a26; color:var(--green); }
  .pill.suspended { background:#3a1414; color:var(--red); }
  .tab-btn { background:none; border:none; color:var(--muted); padding:8px 4px; margin-right:16px; cursor:pointer; border-bottom:2px solid transparent; }
  .tab-btn.active { color:var(--text); border-color:var(--accent); }
  .row-actions button { font-size:.72rem; padding:4px 8px; margin-right:4px; background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:6px; cursor:pointer; }

  /* --- Bottom nav (mobile) --- */
  #bottomNav { display:none; }

  /* --- Responsive --- */
  @media (max-width: 860px) {
    #rail { display:none; }
    #listPane { width:100%; border-right:none; }
    #main { position:fixed; inset:0; z-index:55; background:var(--bg); transform:translateX(100%); transition:transform .18s ease; }
    #app.chat-open #main { transform:translateX(0); }
    #app.chat-open #listPane { display:none; }
    #backBtn { display:inline-block; }
    #bottomNav { display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--panel); border-top:1px solid var(--border); padding:6px 0 max(6px, env(safe-area-inset-bottom)); z-index:50; }
    #app.chat-open #bottomNav { display:none; }
    #bottomNav button { flex:1; background:none; border:none; color:var(--muted); font-size:1.25rem; padding:6px 0; cursor:pointer; }
    #bottomNav button.active { color:var(--accent); }
    #listPane { padding-bottom:56px; }
    #callOverlay video#localVideo { width:90px; bottom:130px; right:14px; }
    .msg { max-width:85%; }
  }
</style>
</head>
<body>

<div id="app">
  <nav id="rail">
    <div class="brand-badge">M</div>
    <button class="rail-btn active" id="railChats" onclick="switchView('chats')" title="Discussions"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></button>
    <button class="rail-btn" id="railStatuses" onclick="switchView('statuses')" title="Statuts"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.4" stroke-dasharray="3.6 3.2"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/></svg></button>
    <button class="rail-btn" id="railCalls" onclick="switchView('calls')" title="Appels"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button>
    <div class="rail-spacer"></div>
    <button class="rail-btn" id="railSettings" onclick="switchView('settings')" title="Paramètres"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </nav>

  <div id="listPane">
    <div id="paneChats">
      <div class="pane-header">Discussions</div>
      <input id="search" placeholder="Rechercher un contact...">
      <div id="searchResults"></div>
      <div class="filter-chips">
        <button class="chip active" id="chipAll" onclick="setChatFilter('all')">Tous</button>
        <button class="chip" id="chipUnread" onclick="setChatFilter('unread')">Non lus</button>
      </div>
      <div id="convList" class="scroll-list"></div>
    </div>

    <div id="paneStatuses" hidden style="display:flex;flex-direction:column;height:100%;">
      <div class="pane-header">Statuts</div>
      <div class="status-add-row" onclick="openStatusComposer()">
        <div class="avatar" id="myStatusAvatar">?<span class="plus">+</span></div>
        <div><div style="font-weight:600;font-size:.9rem;">Mon statut</div><div class="conv-preview">Appuie pour ajouter un statut</div></div>
      </div>
      <div id="statusList" class="scroll-list"></div>
    </div>

    <div id="paneCalls" hidden style="display:flex;flex-direction:column;height:100%;">
      <div class="pane-header">Appels</div>
      <div class="filter-chips">
        <button class="chip active" id="chipCallsAll" onclick="setCallFilter('all')">Tous</button>
        <button class="chip" id="chipCallsMissed" onclick="setCallFilter('missed')">Manqués</button>
      </div>
      <div id="callList" class="scroll-list"></div>
    </div>

    <div id="paneSettings" hidden>
      <div class="pane-header">Paramètres</div>
      <div class="settings-avatar" id="settingsAvatar">?</div>
      <div class="settings-field">
        <label>Nom affiché</label>
        <input id="settingsName">
      </div>
      <div class="settings-field">
        <label>Bio</label>
        <textarea id="settingsBio" rows="2"></textarea>
      </div>
      <button class="btn primary block" onclick="saveProfile()">Enregistrer</button>

      <div class="settings-row">
        <span>Thème</span>
        <div class="theme-switch">
          <button id="themeDarkBtn" onclick="setTheme('dark')">Sombre</button>
          <button id="themeLightBtn" onclick="setTheme('light')">Clair</button>
        </div>
      </div>
      <div class="settings-row">
        <span>Administration</span>
        <button class="btn" id="adminBtn" style="display:none;" onclick="openAdmin()">Ouvrir</button>
      </div>
      <div class="settings-row">
        <span>Déconnexion</span>
        <button class="btn danger" onclick="logout()">Se déconnecter</button>
      </div>
    </div>

    <div id="topbar">
      <span id="meName" style="font-size:.85rem;"></span>
    </div>
  </div>

  <div id="main">
    <div id="chatHeader"></div>
    <div id="chatPlaceholder">Choisis une conversation, ou cherche quelqu'un pour démarrer une discussion.</div>
    <div id="messages" style="display:none;"></div>
    <div id="typingIndicator"></div>
    <div id="composer">

<script>
const token = localStorage.getItem('melora_token');
const me = JSON.parse(localStorage.getItem('melora_user') || 'null');
if (!token || !me) window.location.href = '/login.html';
if (me) me.id = Number(me.id); // coercion défensive : les ids venant de Turso et du JWT doivent être comparés en Number partout

if (localStorage.getItem('melora_must_change') === '1') {
  const np = prompt("Un administrateur a réinitialisé votre mot de passe. Choisissez un nouveau mot de passe (8 caractères min) :");
  if (np && np.length >= 8) {
    api('/api/auth/change-password', 'POST', { new_password: np }).then(() => localStorage.removeItem('melora_must_change'));
  }
}

async function api(path, method = 'GET', body) {
  try {
    const res = await fetch(`${window.MELORA_API_BASE}${path}`, {
      method,
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.status === 401) { localStorage.clear(); window.location.href = '/login.html'; return; }
    return await res.json();
  } catch (err) {
    console.error('Requête échouée:', path, err);
    return { error: 'Impossible de joindre le serveur (réseau ou backend endormi — réessaie dans 30s).' };
  }
}

document.getElementById('meName').textContent = me?.display_name || '';
document.getElementById('settingsAvatar').textContent = (me?.display_name || '?')[0].toUpperCase();
document.getElementById('myStatusAvatar').firstChild.textContent = (me?.display_name || '?')[0].toUpperCase();
document.getElementById('settingsName').value = me?.display_name || '';
document.getElementById('settingsBio').value = me?.bio || '';
if (me?.role === 'admin' || me?.role === 'super_admin') document.getElementById('adminBtn').style.display = 'inline-block';


function logout() {
  localStorage.clear();
  window.location.href = '/login.html';
}

// --- Thème ---
function setTheme(t) {
  localStorage.setItem('melora_theme', t);
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeDarkBtn').classList.toggle('active', t === 'dark');
  document.getElementById('themeLightBtn').classList.toggle('active', t === 'light');
}
setTheme(localStorage.getItem('melora_theme') || 'light');

// --- Navigation entre les 4 onglets ---
let currentView = 'chats';
function switchView(view) {
  currentView = view;
  ['Chats', 'Statuses', 'Calls', 'Settings'].forEach(v => {
    document.getElementById('pane' + v).hidden = v.toLowerCase() !== view;
  });
  ['rail', 'nav'].forEach(prefix => {
    ['Chats', 'Statuses', 'Calls', 'Settings'].forEach(v => {
      const el = document.getElementById(prefix + v);
      if (el) el.classList.toggle('active', v.toLowerCase() === view);
    });
  });
  closeMobileChat();
  if (view === 'statuses') loadStatuses();
  if (view === 'calls') loadCallLog();
}

function openMobileChat() { document.getElementById('app').classList.add('chat-open'); }
function closeMobileChat() { document.getElementById('app').classList.remove('chat-open'); }

let activeConvId = null;
let activeConvName = '';
let activePeerId = null;
let typingTimeout = null;
let allConversations = [];
let chatFilter = 'all';

async function loadConversations() {
  const cached = await window.idbLite.getConversations();
  if (cached.length) { allConversations = cached; renderConversationList(); }

  if (!navigator.onLine) return;
  const data = await api('/api/conversations');
  if (!data || data.error) return;
  allConversations = data.conversations || [];
  renderConversationList();
  await window.idbLite.saveConversations(allConversations);
  updateBadge(allConversations);
}

function setChatFilter(f) {
  chatFilter = f;
  document.getElementById('chipAll').classList.toggle('active', f === 'all');
  document.getElementById('chipUnread').classList.toggle('active', f === 'unread');
  renderConversationList();
}

function renderConversationList() {
  const list = document.getElementById('convList');
  const items = chatFilter === 'unread' ? allConversations.filter(c => c.unread_count > 0) : allConversations;
  if (items.length === 0) {
    list.innerHTML = `<div class="empty-hint">${chatFilter === 'unread' ? 'Aucune conversation non lue.' : "Aucune conversation pour l'instant — cherche quelqu'un ci-dessus pour démarrer."}</div>`;
    return;
  }
  list.innerHTML = '';
  items.forEach(c => {
    const div = document.createElement('div');
    div.className = 'conv-item' + (c.id === activeConvId ? ' active' : '');
    div.onclick = () => openConversation(c.id, c.name || 'Conversation', c.peer_id || null);
    div.innerHTML = `
      <div class="avatar">${(c.name || '?')[0].toUpperCase()}</div>
      <div class="conv-meta">
        <div class="conv-name"><span>${c.name || 'Conversation privée'}</span>${c.unread_count ? `<span class="unread">${c.unread_count}</span>` : ''}</div>
        <div class="conv-preview">${c.last_message || 'Aucun message'}</div>
      </div>`;
    list.appendChild(div);
  });
}

function updateBadge(conversations) {
  const total = conversations.reduce((sum, c) => sum + (c.unread_count || 0), 0);
  if (!('setAppBadge' in navigator)) return;
  if (total > 0) navigator.setAppBadge(total).catch(() => {});
  else navigator.clearAppBadge().catch(() => {});
}

async function openConversation(id, name, peerId = null) {
  activeConvId = id;
  activeConvName = name;
  if (peerId === null) {
    const match = allConversations.find(c => c.id === id);
    peerId = match?.peer_id || null;
  }
  activePeerId = peerId;
  openMobileChat();

  document.getElementById('chatHeader').style.display = 'flex';
  document.getElementById('chatPlaceholder').style.display = 'none';
  document.getElementById('messages').style.display = 'flex';
  document.getElementById('chatHeader').innerHTML = `
    <button id="backBtn" onclick="closeMobileChat()">←</button>
    <div class="avatar">${name[0].toUpperCase()}</div><strong style="flex:1">${name}</strong>
    ${peerId ? `
      <button class="call-btn" onclick="startCall('audio')" title="Appel audio">📞</button>
      <button class="call-btn" onclick="startCall('video')" title="Appel vidéo">🎥</button>
    ` : ''}`;
  document.getElementById('composer').style.display = 'flex';
  renderConversationList();

  const cachedMsgs = await window.idbLite.getMessages(id);
  if (cachedMsgs.length) renderMessages(cachedMsgs);
  else document.getElementById('messages').innerHTML = '<div class="empty-hint">Chargement...</div>';

  if (!navigator.onLine) return;
  const data = await api(`/api/conversations/${id}/messages`);
  if (!data) return;
  if (data.error) {
    document.getElementById('messages').innerHTML = `<div class="empty-hint">${data.error}</div>`;
    return;
  }
  renderMessages(data.messages || []);
  await window.idbLite.saveMessages(id, data.messages || []);
  loadConversations();
  const last = (data.messages || []).at(-1);
  if (last) api(`/api/conversations/${id}/read`, 'PUT', { up_to_message_id: last.id });
}

async function refreshActiveMessages() {
  if (!activeConvId || !navigator.onLine) return;
  const data = await api(`/api/conversations/${activeConvId}/messages`);
  if (!data || data.error) return;
  renderMessages(data.messages || []);
  await window.idbLite.saveMessages(activeConvId, data.messages || []);
}

function tickIcon(m) {
  if (m.status === 'pending') return '🕓';
  if (m.read) return '<span style="color:var(--blue-tick)">✓✓</span>';
  if (m.delivered) return '✓✓';
  return '✓';
}

const revealedContent = new Map(); // id -> {content, media_url, filename} capturé au moment du tap,
// pour ne pas re-masquer un message qu'on vient de révéler si le serveur renvoie sa version
// déjà consommée (viewed_once_at) lors d'un futur rechargement dans la même session.

function renderMessages(msgs) {
  const box = document.getElementById('messages');
  if (!msgs || msgs.length === 0) {
    box.innerHTML = '<div class="empty-hint">Aucun message pour l\'instant — écris le premier !</div>';
    return;
  }
  box.innerHTML = '';
  msgs.forEach(m => {
    const mine = Number(m.sender_id) === Number(me.id);
    const div = document.createElement('div');
    div.className = 'msg ' + (mine ? 'me' : 'them');

    let body;
    if (m.view_once && !mine && revealedContent.has(m.id)) {
      body = renderMessageBody({ ...m, ...revealedContent.get(m.id) });
    } else if (m.view_once && !mine && (m.redacted || m.viewed_once_at)) {
      body = `<span style="color:var(--muted);font-style:italic;">🚫 Message vu unique — déjà consulté</span>`;
    } else if (m.view_once && !mine) {
      body = `<span style="cursor:pointer;color:var(--accent);font-weight:600;" onclick="revealOnce(${m.id}, this)">👁 Message vu unique — appuie pour voir</span>`;
    } else {
      body = renderMessageBody(m);
    }

    div.innerHTML = `${body}<div class="meta">${new Date(m.created_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}${m.view_once ? ' 👁' : ''}${mine ? ' ' + tickIcon(m) : ''}</div>`;
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

function renderMessageBody(m) {
  if (m.type === 'voice') return `<audio controls src="${m.content}" style="max-width:220px;height:32px;"></audio>`;
  if (m.type === 'image') return `<img src="${m.content}" style="max-width:240px;border-radius:8px;display:block;cursor:pointer;" onclick="window.open(this.src)">`;
  if (m.type === 'video') return `<video src="${m.content}" controls style="max-width:240px;border-radius:8px;display:block;"></video>`;
  if (m.type === 'document') return `<a href="${m.content}" download="${m.filename || 'document'}" style="color:inherit;display:flex;align-items:center;gap:8px;text-decoration:none;">📄 <span style="text-decoration:underline;">${escapeHtml(m.filename || 'Document')}</span></a>`;
  return escapeHtml(m.content || '');
}

// Révèle un message "vu unique" (contenu déjà en main côté client depuis le GET initial,
// tant que personne ne l'a encore consommé), et prévient le serveur pour qu'il le masque
// définitivement aux autres ensuite — mais garde le contenu en mémoire locale pour cette
// session, pour ne pas se re-masquer soi-même au prochain rechargement.
async function revealOnce(messageId, el) {
  const cached = (await window.idbLite.getMessages(activeConvId)).find(x => x.id === messageId);
  if (cached) {
    revealedContent.set(messageId, { content: cached.content, media_url: cached.media_url, filename: cached.filename });
    const metaHtml = el.parentElement.querySelector('.meta')?.outerHTML || '';
    el.parentElement.innerHTML = renderMessageBody(cached) + metaHtml;
  }
  api(`/api/messages/${messageId}/consume-once`, 'POST', {});
}
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const content = input.value.trim();
  if (!content || !activeConvId) return;
  input.value = '';
  await sendMessagePayload({ type: 'text', content });
}

// --- Vu unique : bascule appliquée au PROCHAIN envoi (texte, média ou vocal) ---
let pendingViewOnce = false;
function toggleViewOnce() {
  pendingViewOnce = !pendingViewOnce;
  document.getElementById('viewOnceBtn').classList.toggle('active', pendingViewOnce);
}

// --- Pièces jointes : images, vidéos, documents — en base64 dans Turso (pas de S3 sur le
// plan gratuit), donc des plafonds stricts par type, vérifiés ici ET côté serveur. ---
const FILE_LIMITS = { image: 1_500_000, video: 4_000_000, document: 3_000_000 };
const FILE_LABELS = { image: 'Image trop lourde (1,5 Mo max).', video: 'Vidéo trop lourde (quelques secondes max, ~4 Mo).', document: 'Document trop lourd (3 Mo max).' };
async function handleFileAttach(e) {
  const file = e.target.files[0];
  e.target.value = ''; // permet de resélectionner le même fichier ensuite
  if (!file || !activeConvId) return;
  const type = file.type.startsWith('image/') ? 'image' : file.type.startsWith('video/') ? 'video' : 'document';
  const base64 = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
  if (base64.length > FILE_LIMITS[type]) return alert(FILE_LABELS[type]);
  await sendMessagePayload({ type, content: base64, filename: file.name });
}

async function sendMessagePayload(payload) {
  const clientId = crypto.randomUUID();
  if (pendingViewOnce) { payload = { ...payload, view_once: true }; pendingViewOnce = false; document.getElementById('viewOnceBtn').classList.remove('active'); }
  const optimistic = {
    client_message_id: clientId, conversation_id: activeConvId, sender_id: me.id,
    ...payload, created_at: new Date().toISOString(), status: 'pending',
  };
  await window.idbLite.saveMessages(activeConvId, [optimistic]);
  renderMessages(await window.idbLite.getMessages(activeConvId));

  if (!navigator.onLine) {
    await window.idbLite.queuePending({ client_message_id: clientId, conversation_id: activeConvId, ...payload });
    return;
  }
  await trySend(clientId, activeConvId, payload);
}

async function trySend(clientId, convId, payload) {
  try {
    const res = await api(`/api/conversations/${convId}/messages`, 'POST', { client_message_id: clientId, ...payload });
    if (!res || res.error) throw new Error(res?.error || 'echec');
    await window.idbLite.saveMessages(convId, [{ ...res.message, status: 'sent' }]);
    if (convId === activeConvId) renderMessages(await window.idbLite.getMessages(convId));
    loadConversations();
  } catch {
    await window.idbLite.queuePending({ client_message_id: clientId, conversation_id: convId, ...payload });
  }
}

async function flushPendingMessages() {
  const pending = await window.idbLite.getPending();
  for (const p of pending) {
    const { client_message_id, conversation_id, ...payload } = p;
    await trySend(client_message_id, conversation_id, payload);
    await window.idbLite.removePending(client_message_id);
  }
}
window.addEventListener('online', flushPendingMessages);

function onTyping() {
  if (!activeConvId || !navigator.onLine) return;
  api(`/api/conversations/${activeConvId}/typing`, 'POST', { typing: true });
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => api(`/api/conversations/${activeConvId}/typing`, 'POST', { typing: false }), 2000);
}

// --- Recherche pour démarrer une conversation ---
let searchTimeout = null;
document.getElementById('search').addEventListener('input', (e) => {
  clearTimeout(searchTimeout);
  const q = e.target.value.trim();
  const box = document.getElementById('searchResults');
  if (q.length < 2) { box.innerHTML = ''; return; }
  searchTimeout = setTimeout(async () => {
    const data = await api(`/api/users/search?q=${encodeURIComponent(q)}`);
    box.innerHTML = '';
    (data?.users || []).forEach(u => {
      const div = document.createElement('div');
      div.className = 'conv-item';
      div.innerHTML = `<div class="avatar">${u.display_name[0].toUpperCase()}</div><div class="conv-meta"><div class="conv-name"><span>${u.display_name}</span></div><div class="conv-preview">@${u.username}</div></div>`;
      div.onclick = async () => {
        const res = await api('/api/conversations', 'POST', { type: 'private', peer_id: u.id });
        if (!res || res.error) return alert(res?.error || 'Impossible de démarrer la conversation.');
        document.getElementById('search').value = '';
        box.innerHTML = '';
        openConversation(res.conversation.id, u.display_name, u.id);
      };
      box.appendChild(div);
    });
    if ((data?.users || []).length === 0) box.innerHTML = '<div class="empty-hint">Personne ne correspond à cette recherche.</div>';
  }, 300);
});

// --- Profil (Paramètres) ---
async function saveProfile() {
  const display_name = document.getElementById('settingsName').value.trim();
  const bio = document.getElementById('settingsBio').value.trim();
  if (!display_name) return alert('Le nom affiché ne peut pas être vide.');
  const res = await api('/api/users/me', 'PATCH', { display_name, bio });
  if (!res || res.error) return alert(res?.error || 'Échec de la mise à jour.');
  me.display_name = display_name; me.bio = bio;
  localStorage.setItem('melora_user', JSON.stringify(me));
  document.getElementById('meName').textContent = display_name;
  alert('Profil mis à jour.');
}

// --- Statuts ---
const STATUS_COLORS = ['#d9822b', '#2a9d55', '#2b7fd9', '#c0392b', '#7a52c9'];
let statusComposerColor = STATUS_COLORS[0];
function renderStatusSwatches() {
  const sw = document.getElementById('statusSwatches');
  sw.innerHTML = '';
  STATUS_COLORS.forEach(c => {
    const b = document.createElement('div');
    b.className = 'swatch' + (c === statusComposerColor ? ' active' : '');
    b.style.background = c;
    b.onclick = () => { statusComposerColor = c; renderStatusSwatches(); }; // ne touche jamais au texte
    sw.appendChild(b);
  });
}
function openStatusComposer() {
  document.getElementById('statusText').value = '';
  renderStatusSwatches();
  document.getElementById('statusComposer').style.display = 'flex';
}
function closeStatusComposer() { document.getElementById('statusComposer').style.display = 'none'; }
async function submitStatus() {
  const content = document.getElementById('statusText').value.trim();
  if (!content) return;
  const res = await api('/api/statuses', 'POST', { content, bg_color: statusComposerColor });
  if (!res || res.error) return alert(res?.error || 'Échec de la publication.');

}

async function loadStatuses() {
  const data = await api('/api/statuses');
  const list = document.getElementById('statusList');
  if (!data || data.error) { list.innerHTML = `<div class="empty-hint">${data?.error || 'Impossible de charger les statuts.'}</div>`; return; }
  const statuses = data.statuses || [];
  if (statuses.length === 0) { list.innerHTML = '<div class="empty-hint">Aucun statut actif pour le moment.</div>'; return; }
  // Groupé par auteur, le plus récent en tête.
  const byAuthor = new Map();
  statuses.forEach(s => { if (!byAuthor.has(s.user_id)) byAuthor.set(s.user_id, []); byAuthor.get(s.user_id).push(s); });
  list.innerHTML = '';
  allStatusItems = []; // liste à plat, dans l'ordre d'affichage, pour naviguer d'une personne à l'autre
  for (const [, items] of byAuthor) {
    const startIndex = allStatusItems.length;
    allStatusItems.push(...items);
    const s = items[0];
    const allSeen = items.every(x => x.viewed_by_me);
    const div = document.createElement('div');
    div.className = 'status-item';
    div.innerHTML = `
      <div class="status-ring${allSeen ? ' seen' : ''}"><div class="avatar" style="background:${s.bg_color}">${s.author_name[0].toUpperCase()}</div></div>
      <div><div style="font-weight:600;font-size:.9rem;">${s.author_name}</div><div class="status-time">${items.length} statut${items.length > 1 ? 's' : ''}</div></div>`;
    div.onclick = () => openStatusViewer(startIndex);
    list.appendChild(div);
  }
}

// Navigation à plat sur TOUS les statuts (comme WhatsApp : après le dernier statut d'une
// personne, on passe directement au premier de la suivante, sans repasser par la liste).
let allStatusItems = [];
let statusIndex = 0;

function openStatusViewer(index) {
  statusIndex = index;
  document.getElementById('statusOverlay').style.display = 'flex';
  showCurrentStatus();
}
function showCurrentStatus() {
  const s = allStatusItems[statusIndex];
  if (!s) return closeStatusOverlay();
  const mine = Number(s.user_id) === Number(me.id);
  document.getElementById('statusOverlayTop').innerHTML = `
    <div class="avatar" style="width:34px;height:34px;background:${s.bg_color};flex-shrink:0;">${s.author_name[0].toUpperCase()}</div>
    <div style="min-width:0;"><strong style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${s.author_name}</strong><span style="font-size:.72rem;color:#ccc;">${new Date(s.created_at).toLocaleString('fr-FR', { hour: '2-digit', minute: '2-digit' })}</span></div>`;
  const card = document.getElementById('statusOverlayCard');
  card.style.background = s.bg_color;
  card.textContent = s.content;
  document.getElementById('statusDeleteBtn').style.display = mine ? 'inline-block' : 'none';
  if (!mine) api(`/api/statuses/${s.id}/view`, 'POST', {});
}
function nextStatus() {
  statusIndex++;
  if (statusIndex >= allStatusItems.length) return closeStatusOverlay();
  showCurrentStatus();
}
function prevStatus() {
  if (statusIndex <= 0) return;
  statusIndex--;
  showCurrentStatus();
}
async function deleteCurrentStatus() {
  const s = allStatusItems[statusIndex];
  if (!s) return;
  if (!confirm('Retirer ce statut ? Il ne sera plus visible par personne.')) return;
  const res = await api(`/api/statuses/${s.id}`, 'DELETE', {});
  if (!res || res.error) return alert(res?.error || 'Échec de la suppression.');
  allStatusItems.splice(statusIndex, 1);
  if (statusIndex >= allStatusItems.length) return closeStatusOverlay();
  showCurrentStatus();
}
function closeStatusOverlay() {
  document.getElementById('statusOverlay').style.display = 'none';
  loadStatuses();
}

function urlBase64ToUint8Array(base64) {
  const padding = '='.repeat((4 - base64.length % 4) % 4);
  const base64safe = (base64 + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64safe);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
async function subscribeToPush(registration) {
  try {
    if (!('PushManager' in window)) return;
    const { enabled, public_key } = await api('/api/push/vapid-public-key');
    if (!enabled) return;
    const already = await registration.pushManager.getSubscription();
    if (already) return api('/api/push/subscribe', 'POST', { subscription: already.toJSON() });
    if (Notification.permission === 'denied') return;
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') return;
    const subscription = await registration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(public_key),
    });
    await api('/api/push/subscribe', 'POST', { subscription: subscription.toJSON() });
  } catch (err) {
    console.warn('Push notifications indisponibles:', err);
  }
}

let mediaRecorder = null;
let recordedChunks = [];
async function toggleVoiceRecording() {
  if (!activeConvId) return;
  const btn = document.getElementById('micBtn');
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
    mediaRecorder.ondataavailable = (e) => { if (e.data.size) recordedChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      btn.textContent = '🎙️';
      const blob = new Blob(recordedChunks, { type: 'audio/webm' });
      if (blob.size > 350_000) return alert('Note vocale trop longue (30s max) — réessaie plus court.');
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
      await sendMessagePayload({ type: 'voice', content: base64 });
    };
    mediaRecorder.start();
    btn.textContent = '⏹️';
  } catch {
    alert("Impossible d'accéder au micro (permission refusée ?).");
  }
}

// ============================================================
// APPELS AUDIO/VIDÉO — WebRTC natif (RTCPeerConnection), signaling relayé via SSE + /api/calls/*.
// ============================================================
let activeCall = null;
let incomingCall = null;

async function getIceServers() {
  try {
    const data = await api('/api/calls/ice-servers');
    return data?.ice_servers || [{ urls: 'stun:stun.l.google.com:19302' }];
  } catch {
    return [{ urls: 'stun:stun.l.google.com:19302' }];
  }
}

function buildPeerConnection(iceServers, callId) {
  const pc = new RTCPeerConnection({ iceServers });
  pc.onicecandidate = (e) => {
    if (e.candidate) api(`/api/calls/${callId}/signal`, 'POST', { signal_type: 'ice-candidate', payload: e.candidate });
  };
  pc.ontrack = (e) => {
    const remote = document.getElementById('remoteVideo');
    if (remote.srcObject !== e.streams[0]) remote.srcObject = e.streams[0];
  };
  pc.onconnectionstatechange = () => {
    if (['disconnected', 'failed', 'closed'].includes(pc.connectionState) && activeCall?.callId === callId) {
      document.getElementById('callStatus').textContent = 'Connexion perdue...';
    }
  };
  return pc;
}

async function startCall(mode) {
  if (!activePeerId || !activeConvId || activeCall) return;
  const iceServers = await getIceServers();
  const res = await api('/api/calls/invite', 'POST', { conversation_id: activeConvId, mode });
  if (!res || res.error) return alert(res?.error || "Impossible de démarrer l'appel.");
  if (res.warning) return alert(res.warning);

  const localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: mode === 'video' });
  const pc = buildPeerConnection(iceServers, res.call_id);
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  activeCall = { callId: res.call_id, peerId: activePeerId, mode, pc, localStream, isCaller: true };
  showCallOverlay(activeConvName, mode, 'Appel en cours...');
}

es.addEventListener('call.invite', (e) => {
  const data = JSON.parse(e.data);
  if (activeCall || incomingCall) return api(`/api/calls/${data.call_id}/decline`, 'POST', {});
  incomingCall = data;
  document.getElementById('incomingCallName').textContent = data.from.display_name;
  document.getElementById('incomingCallMode').textContent = data.mode === 'video' ? 'Appel vidéo entrant' : 'Appel audio entrant';
  document.getElementById('incomingCall').style.display = 'block';
});

async function acceptIncomingCall() {
  if (!incomingCall) return;
  const { call_id, mode, from } = incomingCall;
  document.getElementById('incomingCall').style.display = 'none';
  incomingCall = null;

  const iceServers = await getIceServers();
  const localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: mode === 'video' });
  const pc = buildPeerConnection(iceServers, call_id);
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  activeCall = { callId: call_id, peerId: from.id, mode, pc, localStream, isCaller: false };
  showCallOverlay(from.display_name, mode, 'Connexion...');
  await api(`/api/calls/${call_id}/accept`, 'POST', {});
}

function declineIncomingCall() {
  if (!incomingCall) return;
  api(`/api/calls/${incomingCall.call_id}/decline`, 'POST', {});
  document.getElementById('incomingCall').style.display = 'none';
  incomingCall = null;
}

es.addEventListener('call.accepted', async (e) => {
  const data = JSON.parse(e.data);
  if (!activeCall || activeCall.callId !== data.call_id || !activeCall.isCaller) return;
  document.getElementById('callStatus').textContent = 'Connexion...';
  const offer = await activeCall.pc.createOffer();
  await activeCall.pc.setLocalDescription(offer);
  api(`/api/calls/${data.call_id}/signal`, 'POST', { signal_type: 'offer', payload: offer });
});

es.addEventListener('call.signal', async (e) => {
  const { call_id, signal_type, payload } = JSON.parse(e.data);
  if (!activeCall || activeCall.callId !== call_id) return;
  const pc = activeCall.pc;
  if (signal_type === 'offer') {
    await pc.setRemoteDescription(new RTCSessionDescription(payload));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    api(`/api/calls/${call_id}/signal`, 'POST', { signal_type: 'answer', payload: answer });
  } else if (signal_type === 'answer') {
    await pc.setRemoteDescription(new RTCSessionDescription(payload));
    document.getElementById('callStatus').textContent = 'En communication';
  } else if (signal_type === 'ice-candidate') {
    try { await pc.addIceCandidate(new RTCIceCandidate(payload)); } catch {}
  }
});

es.addEventListener('call.declined', () => { alert('Appel refusé.'); cleanupCall(); });
es.addEventListener('call.ended', () => cleanupCall());

function showCallOverlay(name, mode, status) {
  document.getElementById('callPeerName').textContent = name;
  document.getElementById('callStatus').textContent = status;
  document.getElementById('localVideo').srcObject = activeCall.localStream;
  document.getElementById('localVideo').style.display = mode === 'video' ? 'block' : 'none';
  document.getElementById('remoteVideo').style.display = mode === 'video' ? 'block' : 'none';
  document.getElementById('callOverlay').style.display = 'flex';
}

function hangupCall() {
  if (activeCall) api(`/api/calls/${activeCall.callId}/end`, 'POST', {});
  cleanupCall();
}

function cleanupCall() {
  if (activeCall) {
    activeCall.pc.close();
    activeCall.localStream.getTracks().forEach(t => t.stop());
  }
  activeCall = null;
  document.getElementById('callOverlay').style.display = 'none';
  document.getElementById('remoteVideo').srcObject = null;
  document.getElementById('localVideo').srcObject = null;
  if (currentView === 'calls') loadCallLog();
}

function toggleMute() {
  if (!activeCall) return;
  const track = activeCall.localStream.getAudioTracks()[0];
  track.enabled = !track.enabled;
  document.getElementById('muteBtn').classList.toggle('off', !track.enabled);
}
function toggleCamera() {
  if (!activeCall || activeCall.mode !== 'video') return;
  const track = activeCall.localStream.getVideoTracks()[0];
  track.enabled = !track.enabled;
  document.getElementById('camBtn').classList.toggle('off', !track.enabled);
}
