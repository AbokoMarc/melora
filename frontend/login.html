<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melora — Connexion</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0d0d0f">
<style>
  :root { --bg:#0d0d0f; --panel:#17171b; --border:#2a2a30; --text:#e8e6e1; --muted:#8b8a92; --accent:#d9822b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text);
         display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
  .card { width:100%; max-width:400px; }
  .logo { display:flex; align-items:center; gap:10px; margin-bottom:24px; }
  .logo-badge { width:32px; height:32px; border-radius:8px; background:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; color:#111; }
  .logo span { font-size:1.4rem; font-family: Georgia, serif; }
  h1 { font-size:1.3rem; margin:0 0 6px; }
  p.sub { color:var(--muted); margin:0 0 24px; font-size:.92rem; }
  label { display:block; font-size:.72rem; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin:14px 0 6px; }
  input, select { width:100%; padding:11px 12px; background:#0f0f12; border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:.95rem; }
  input:focus, select:focus { outline:none; border-color:var(--accent); }
  button.primary { width:100%; margin-top:20px; padding:12px; background:var(--accent); color:#111; border:none; border-radius:8px; font-weight:600; font-size:.95rem; cursor:pointer; }
  button.primary:hover { filter:brightness(1.08); }
  .switch { text-align:center; margin-top:16px; font-size:.88rem; color:var(--muted); }
  .switch a { color:var(--accent); text-decoration:none; cursor:pointer; }
  .error { background:#3a1414; border:1px solid #6b2323; color:#f3b3b3; padding:10px 12px; border-radius:8px; font-size:.85rem; margin-top:14px; display:none; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="card">
  <div class="logo"><div class="logo-badge">M</div><span>Melora</span></div>

  <div id="loginView">
    <h1>Se connecter</h1>
    <p class="sub">Messagerie professionnelle — équipes, écoles et organisations.</p>
    <label>Adresse e-mail</label>
    <input id="loginEmail" type="email" placeholder="vous@organisation.com">
    <label>Mot de passe</label>
    <input id="loginPassword" type="password" placeholder="••••••••">
    <button class="primary" onclick="login()">Se connecter</button>
    <div class="switch">Pas encore de compte ? <a onclick="show('register')">Créer un compte</a></div>
  </div>

  <div id="registerView" class="hidden">
    <h1>Créer votre compte</h1>
    <p class="sub">Renseignez vos informations.</p>
    <label>Nom d'utilisateur</label>
    <input id="regUsername" placeholder="votre_identifiant">
    <label>Adresse e-mail</label>
    <input id="regEmail" type="email" placeholder="vous@organisation.com">
    <label>Mot de passe</label>
    <input id="regPassword" type="password" placeholder="8 caractères minimum">
    <label>Nom affiché</label>
    <input id="regDisplayName" placeholder="Prénom Nom">
    <label>Organisation (optionnel)</label>
    <input id="regOrg" placeholder="Entreprise, école, communauté...">
    <button class="primary" onclick="register()">Créer le compte</button>
    <div class="switch">Déjà inscrit ? <a onclick="show('login')">Se connecter</a></div>
  </div>

  <div id="err" class="error"></div>
</div>

<script>
function show(which) {
  document.getElementById('loginView').classList.toggle('hidden', which !== 'login');
  document.getElementById('registerView').classList.toggle('hidden', which !== 'register');
  document.getElementById('err').style.display = 'none';
}
function showError(msg) {
  const el = document.getElementById('err');
  el.textContent = msg;
  el.style.display = 'block';
}
async function login() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  try {
    const res = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
    const data = await res.json();
    if (!res.ok) return showError(data.error || 'Erreur de connexion.');
    localStorage.setItem('melora_token', data.token);
    localStorage.setItem('melora_user', JSON.stringify(data.user));
    if (data.must_change_password) {
      localStorage.setItem('melora_must_change', '1');
    }
    window.location.href = '/app.html';
  } catch { showError('Impossible de contacter le serveur.'); }
}
async function register() {
  const body = {
    username: document.getElementById('regUsername').value.trim(),
    email: document.getElementById('regEmail').value.trim(),
    password: document.getElementById('regPassword').value,
    display_name: document.getElementById('regDisplayName').value.trim(),
    organization_name: document.getElementById('regOrg').value.trim() || null,
  };
  try {
    const res = await fetch('/api/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) return showError(data.error || 'Erreur lors de la création du compte.');
    localStorage.setItem('melora_token', data.token);
    localStorage.setItem('melora_user', JSON.stringify(data.user));
    window.location.href = '/app.html';
  } catch { showError('Impossible de contacter le serveur.'); }
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
if (localStorage.getItem('melora_token')) window.location.href = '/app.html';
</script>
</body>
</html>
