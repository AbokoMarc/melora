services:
  - type: web
    name: melora
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Notifications push (Web Push / VAPID). Générer avec : npm run vapid:generate
      # Laisser vide -> l'app fonctionne quand même, juste sans notifications push.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@example.com
      # TURN (optionnel, ex: compte gratuit metered.ca) — améliore la fiabilité des appels
      # sur les réseaux restrictifs. Laisser vide : le STUN public suffit dans la majorité des cas.
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
# Frontend déployé séparément sur Vercel (root du projet Vercel = dossier frontend/, voir
# frontend/vercel.json). Une fois les deux déployés, renseigner l'URL Render réelle dans
# frontend/config.js (window.MELORA_API_BASE) et redéployer le frontend.
# Turso : créer la base sur turso.tech, récupérer TURSO_DATABASE_URL / TURSO_AUTH_TOKEN.
